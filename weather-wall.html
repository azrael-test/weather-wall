<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Weather Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wash-color: #8b93a1;
    --wash-opacity: 0;
    --g1:#0b1330; --g2:#16204a; --g3:#232d5c; --g4:#232d5c;
  }
  @property --wash-opacity { syntax: '<number>'; inherits: true; initial-value: 0; }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%; overflow:hidden;
    font-family:'Space Grotesk', sans-serif;
    background:#0b1330;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  #app{position:fixed; inset:0; width:100%; height:100%;}

  /* ---------- SKY ---------- */
  .sky{width:100%; height:100%; display:block;}
  stop{ transition: stop-color 2.5s ease; }
  .wash-rect{ fill:var(--wash-color); opacity:var(--wash-opacity); transition: fill 2.5s ease, opacity 2.5s ease; }

  .star{ fill:#fff; opacity:0; transition: opacity 2s ease; }
  .scene.bucket-night .star{ opacity:.85; animation: twinkle 4s ease-in-out infinite; }
  .scene.bucket-dawn .star, .scene.bucket-dusk .star{ opacity:.35; }
  @keyframes twinkle{ 0%,100%{opacity:.85} 50%{opacity:.35} }

  #sunmoon{ filter:drop-shadow(0 0 6px rgba(255,225,150,.9)); transition: fill 1.5s ease, filter 1.5s ease; }
  .scene.bucket-night #sunmoon{ fill:#e8edf5; filter:drop-shadow(0 0 5px rgba(230,238,250,.75)); }
  .scene:not(.bucket-night) #sunmoon{ fill:#ffe4a3; }

  .cloud{ fill:#eef2f7; opacity:0; transition: opacity 2s ease; }
  .scene.bucket-night .cloud{ fill:#3a4260; }
  .scene.state-partly .cloud{ opacity:.55; }
  .scene.state-overcast .cloud{ opacity:.85; }
  .scene.state-drizzle .cloud{ opacity:.7; }
  .scene.state-rain .cloud{ opacity:.9; }
  .scene.state-snow .cloud{ opacity:.75; }
  .scene.state-storm .cloud{ opacity:.95; filter:brightness(.55); }
  .cloud-a{ animation: driftA 90s linear infinite; }
  .cloud-b{ animation: driftB 130s linear infinite; }
  .cloud-c{ animation: driftC 160s linear infinite; }
  @keyframes driftA{ from{transform:translateX(-20%)} to{transform:translateX(20%)} }
  @keyframes driftB{ from{transform:translateX(15%)} to{transform:translateX(-25%)} }
  @keyframes driftC{ from{transform:translateX(-10%)} to{transform:translateX(30%)} }

  .fogband{ fill:#e7ecf1; opacity:0; transition:opacity 2s ease; }
  .scene.state-fog .fogband{ opacity:.5; }
  .fog-1{ animation: fogDrift1 60s linear infinite; }
  .fog-2{ animation: fogDrift2 85s linear infinite; }
  @keyframes fogDrift1{ from{transform:translateX(-15%)} to{transform:translateX(15%)} }
  @keyframes fogDrift2{ from{transform:translateX(15%)} to{transform:translateX(-15%)} }

  .precip{ display:none; }
  .scene.state-rain .precip.rain, .scene.state-storm .precip.rain{ display:block; }
  .scene.state-drizzle .precip.rain{ display:block; opacity:.55; }
  .scene.state-snow .precip.snow{ display:block; }

  .drop{ stroke:#cfe0f5; stroke-width:.35; opacity:.75; animation: fall 1.1s linear infinite; }
  @keyframes fall{ from{ transform:translateY(-10%); } to{ transform:translateY(115%); } }

  .flake{ fill:#ffffff; opacity:.9; animation: snowFall linear infinite; }
  @keyframes snowFall{
    0%{ transform:translate(0,-10%); }
    50%{ transform:translate(3%,50%); }
    100%{ transform:translate(-2%,115%); }
  }

  #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .flash-hit{ animation: strike .55s ease-out; }
  @keyframes strike{ 0%{opacity:0} 8%{opacity:.85} 16%{opacity:0} 24%{opacity:.5} 34%{opacity:0} 100%{opacity:0} }

  .vignette{
    position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%);
  }

  /* ---------- OVERLAY ---------- */
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; padding: 4vh 5vw; color:#fdfdfb; pointer-events:none;}
  .outlined{
    -webkit-text-stroke: 1.5px #000;
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 2px 18px rgba(0,0,0,.45);
  }
  .top{ }
  .time{ font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:6.4vw; line-height:1; letter-spacing:-0.01em; font-variant-numeric: tabular-nums; }
  .date{ margin-top:.6vh; font-size:1.35vw; letter-spacing:.14em; text-transform:uppercase; opacity:.72; }

  .bottom{ display:flex; align-items:flex-end; justify-content:space-between; gap:3vw; }
  .temp-row{ display:flex; align-items:flex-start; }
  .temp{ font-family:'Fraunces', serif; font-weight:400; font-size:13vw; line-height:.85; letter-spacing:-.02em; }
  .unit{ font-family:'Fraunces', serif; font-weight:300; font-size:4.5vw; margin-top:1.2vw; }
  .condition{ font-size:1.7vw; letter-spacing:.12em; text-transform:uppercase; opacity:.9; margin-top:.5vh; }
  .meta{ margin-top:1.4vh; font-size:1.25vw; opacity:.78; }
  .loc{ margin-top:.4vh; font-size:1.3vw; opacity:.85; font-weight:500; }
  .updated{ margin-top:.6vh; font-size:.95vw; opacity:.55; }
  .date.outlined, .condition.outlined, .meta.outlined, .loc.outlined, .updated.outlined{ -webkit-text-stroke-width: .7px; }

  /* ---------- FORECAST (bottom right) ---------- */
  .forecast{ display:flex; flex-direction:column; align-items:flex-end; gap:1.6vh; text-align:right; flex-shrink:0; }
  .fc-section{ display:flex; flex-direction:column; align-items:flex-end; }
  .fc-label{ font-size:1vw; letter-spacing:.16em; text-transform:uppercase; opacity:.62; margin-bottom:.6vh; -webkit-text-stroke-width:.6px; }
  .fc-hours{ display:flex; gap:1.6vw; }
  .fc-hour{ display:flex; flex-direction:column; align-items:center; gap:.3vh; }
  .fc-hour-time{ font-size:.95vw; opacity:.75; -webkit-text-stroke-width:.5px; }
  .fc-hour-temp{ font-family:'Fraunces', serif; font-size:2vw; -webkit-text-stroke-width:.6px; }
  .fc-tomorrow{ display:flex; align-items:baseline; gap:.6vw; }
  .fc-tomorrow-cond{ font-size:1.2vw; letter-spacing:.06em; text-transform:uppercase; opacity:.9; -webkit-text-stroke-width:.6px; }
  .fc-tomorrow-hilo{ font-size:1.1vw; opacity:.75; -webkit-text-stroke-width:.5px; }

  /* ---------- PERMISSION / STATUS ---------- */
  .status{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; text-align:center; padding:8vw;
    background:rgba(8,12,26,.55); backdrop-filter:blur(6px); color:#fdfdfb;
  }
  .status p{ font-size:1.6vw; max-width:640px; line-height:1.5; opacity:.9; }
  .status button{
    font-family:'Space Grotesk',sans-serif; font-size:1.3vw; font-weight:500;
    padding:.9em 1.8em; border-radius:999px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.08); color:#fdfdfb; cursor:pointer; pointer-events:auto;
    letter-spacing:.02em;
  }
  .status button:active{ background:rgba(255,255,255,.2); }
  .status.hidden{ display:none; }

  @media (max-width: 700px){
    .time{ font-size:11vw; } .date{font-size:2.6vw;}
    .temp{ font-size:22vw; } .unit{ font-size:7vw; }
    .condition{ font-size:3vw; } .meta,.loc{ font-size:2.4vw; } .updated{font-size:1.8vw;}
    .status p, .status button{ font-size:3vw; }
    .bottom{ flex-direction:column; align-items:flex-start; gap:2.5vh; }
    .forecast{ align-items:flex-start; text-align:left; width:100%; }
    .fc-label{ font-size:2.4vw; }
    .fc-hour-time{ font-size:2.2vw; }
    .fc-hour-temp{ font-size:4.5vw; }
    .fc-tomorrow-cond, .fc-tomorrow-hilo{ font-size:2.6vw; }
    .fc-hours{ gap:3.5vw; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="scene bucket-day state-clear" id="scene">
    <svg class="sky" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop id="s1" offset="0%"/>
          <stop id="s2" offset="40%"/>
          <stop id="s3" offset="75%"/>
          <stop id="s4" offset="100%"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" fill="url(#skyGrad)"/>
      <rect class="wash-rect" width="100" height="100"/>

      <g class="stars" id="stars"></g>

      <circle id="sunmoon" r="3.4" cx="15" cy="60"/>

      <g class="clouds">
        <ellipse class="cloud cloud-a" cx="15" cy="22" rx="12" ry="4"/>
        <ellipse class="cloud cloud-a" cx="24" cy="20" rx="8" ry="3"/>
        <ellipse class="cloud cloud-b" cx="55" cy="15" rx="14" ry="4.5"/>
        <ellipse class="cloud cloud-b" cx="66" cy="17" rx="9" ry="3"/>
        <ellipse class="cloud cloud-c" cx="80" cy="30" rx="11" ry="3.5"/>
        <ellipse class="cloud cloud-c" cx="35" cy="35" rx="10" ry="3"/>
      </g>

      <g class="fog">
        <rect class="fogband fog-1" x="-20" y="55" width="140" height="10" rx="5"/>
        <rect class="fogband fog-2" x="-20" y="70" width="140" height="12" rx="6"/>
        <rect class="fogband fog-1" x="-20" y="85" width="140" height="14" rx="7"/>
      </g>

      <g class="precip rain" id="rainGroup"></g>
      <g class="precip snow" id="snowGroup"></g>
    </svg>
    <div id="flash"></div>
    <div class="vignette"></div>
  </div>

  <div class="overlay">
    <div class="top">
      <div class="time outlined" id="time">--:--</div>
      <div class="date outlined" id="date">--</div>
    </div>
    <div class="bottom">
      <div class="current">
        <div class="temp-row">
          <div class="temp outlined" id="temp">--</div><div class="unit outlined">°</div>
        </div>
        <div class="condition outlined" id="condition">Loading…</div>
        <div class="meta outlined"><span id="feels"></span></div>
        <div class="loc outlined" id="loc"></div>
        <div class="updated outlined" id="updated"></div>
      </div>
      <div class="forecast">
        <div class="fc-section">
          <div class="fc-label outlined">Rest of Today</div>
          <div class="fc-hours" id="fcHours"></div>
        </div>
        <div class="fc-section">
          <div class="fc-label outlined">Tomorrow</div>
          <div class="fc-tomorrow" id="fcTomorrow"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="status" id="status">
    <p id="statusText">This display shows local weather using this iPad's location. Tap below to allow access — you'll only need to do this once.</p>
    <button id="statusBtn">Enable location</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var els = {
    scene: document.getElementById('scene'),
    time: document.getElementById('time'),
    date: document.getElementById('date'),
    temp: document.getElementById('temp'),
    condition: document.getElementById('condition'),
    feels: document.getElementById('feels'),
    loc: document.getElementById('loc'),
    updated: document.getElementById('updated'),
    fcHours: document.getElementById('fcHours'),
    fcTomorrow: document.getElementById('fcTomorrow'),
    status: document.getElementById('status'),
    statusText: document.getElementById('statusText'),
    statusBtn: document.getElementById('statusBtn'),
    sunmoon: document.getElementById('sunmoon'),
    stars: document.getElementById('stars'),
    rainGroup: document.getElementById('rainGroup'),
    snowGroup: document.getElementById('snowGroup'),
    flash: document.getElementById('flash'),
    s1: document.getElementById('s1'), s2: document.getElementById('s2'),
    s3: document.getElementById('s3'), s4: document.getElementById('s4')
  };

  var GRADIENTS = {
    night: ['#0b1330','#16204a','#232d5c','#1c2547'],
    dawn:  ['#2b2350','#7a5478','#e0996b','#f6c98f'],
    day:   ['#2f7bd4','#5fa3e0','#a9d3f2','#dcedfa'],
    dusk:  ['#1b1f4b','#6a3f6b','#e0724f','#f7b26a']
  };
  var WASH = {
    clear:   {color:'#8b93a1', op:0},
    partly:  {color:'#8b93a1', op:.18},
    overcast:{color:'#6b7280', op:.30},
    fog:     {color:'#d9dde2', op:.45},
    drizzle: {color:'#7c8a99', op:.25},
    rain:    {color:'#4b5563', op:.35},
    snow:    {color:'#dbe4ee', op:.22},
    storm:   {color:'#262b36', op:.55}
  };
  var LABELS = {
    clear:'Clear Sky', partly:'Partly Cloudy', overcast:'Overcast', fog:'Fog',
    drizzle:'Drizzle', rain:'Rain', snow:'Snow', storm:'Thunderstorm'
  };

  function codeToState(code){
    if(code===0) return 'clear';
    if(code===1) return 'clear';
    if(code===2) return 'partly';
    if(code===3) return 'overcast';
    if(code===45||code===48) return 'fog';
    if(code===51||code===53||code===55||code===56||code===57) return 'drizzle';
    if(code===61||code===63||code===65||code===66||code===67||code===80||code===81||code===82) return 'rain';
    if(code===71||code===73||code===75||code===77||code===85||code===86) return 'snow';
    if(code===95||code===96||code===99) return 'storm';
    return 'clear';
  }

  var lat=null, lon=null, placeName='';
  var todaySunrise=null, todaySunset=null; // Date objects, local
  var currentBucket='day', currentState='clear';
  var lightningTimer=null;
  var dataReady=false;

  function minutesOf(d){ return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }

  function computeBucket(now, sunrise, sunset){
    if(!sunrise||!sunset) return 'day';
    var n=minutesOf(now), r=minutesOf(sunrise), s=minutesOf(sunset);
    if(n >= r-45 && n < r+30) return 'dawn';
    if(n >= r+30 && n < s-30) return 'day';
    if(n >= s-30 && n <= s+45) return 'dusk';
    return 'night';
  }

  function applyGradient(bucket){
    var g = GRADIENTS[bucket];
    els.s1.style.setProperty('stop-color', g[0]);
    els.s2.style.setProperty('stop-color', g[1]);
    els.s3.style.setProperty('stop-color', g[2]);
    els.s4.style.setProperty('stop-color', g[3]);
  }

  function applyWash(state){
    var w = WASH[state];
    els.scene.style.setProperty('--wash-color', w.color);
    els.scene.style.setProperty('--wash-opacity', w.op);
  }

  function setClasses(bucket, state){
    els.scene.className = 'scene bucket-' + bucket + ' state-' + state;
  }

  function positionSunMoon(now){
    if(!todaySunrise || !todaySunset) return;
    var n = minutesOf(now), r = minutesOf(todaySunrise), s = minutesOf(todaySunset);
    var frac, isDayNow = (n >= r && n <= s);
    if(isDayNow){
      frac = (n - r) / (s - r);
    } else {
      var nightStart = s, nightEnd = r + 1440;
      var cur = n < r ? n + 1440 : n;
      frac = (cur - nightStart) / (nightEnd - nightStart);
    }
    frac = Math.max(0, Math.min(1, frac));
    var x = 8 + frac * 84;
    var y = 78 - Math.sin(frac * Math.PI) * 62;
    els.sunmoon.setAttribute('cx', x.toFixed(2));
    els.sunmoon.setAttribute('cy', y.toFixed(2));
  }

  function buildStars(){
    var frag = '';
    for(var i=0;i<45;i++){
      var x = (Math.random()*100).toFixed(1);
      var y = (Math.random()*55).toFixed(1);
      var r = (Math.random()*0.5+0.2).toFixed(2);
      frag += '<circle class="star" cx="'+x+'" cy="'+y+'" r="'+r+'" style="animation-delay:'+(Math.random()*4).toFixed(2)+'s"></circle>';
    }
    els.stars.innerHTML = frag;
  }

  function buildRain(){
    var frag='';
    for(var i=0;i<45;i++){
      var x=(Math.random()*100).toFixed(1);
      var y1=(Math.random()*100).toFixed(1);
      var dur=(0.6+Math.random()*0.5).toFixed(2);
      var delay=(Math.random()*1.2).toFixed(2);
      frag += '<line class="drop" x1="'+x+'" y1="'+y1+'" x2="'+(parseFloat(x)-0.6)+'" y2="'+(parseFloat(y1)+4)+'" style="animation-duration:'+dur+'s; animation-delay:-'+delay+'s"></line>';
    }
    els.rainGroup.innerHTML = frag;
  }

  function buildSnow(){
    var frag='';
    for(var i=0;i<40;i++){
      var x=(Math.random()*100).toFixed(1);
      var y1=(Math.random()*100).toFixed(1);
      var r=(Math.random()*0.6+0.25).toFixed(2);
      var dur=(4+Math.random()*4).toFixed(2);
      var delay=(Math.random()*6).toFixed(2);
      frag += '<circle class="flake" cx="'+x+'" cy="'+y1+'" r="'+r+'" style="animation-duration:'+dur+'s; animation-delay:-'+delay+'s"></circle>';
    }
    els.snowGroup.innerHTML = frag;
  }

  function startLightning(){
    stopLightning();
    function loop(){
      els.flash.classList.remove('flash-hit');
      void els.flash.offsetWidth;
      els.flash.classList.add('flash-hit');
      lightningTimer = setTimeout(loop, 4000 + Math.random()*7000);
    }
    lightningTimer = setTimeout(loop, 2000 + Math.random()*3000);
  }
  function stopLightning(){
    if(lightningTimer){ clearTimeout(lightningTimer); lightningTimer=null; }
  }

  function tickClock(){
    var now = new Date();
    els.time.textContent = now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    els.date.textContent = now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});

    if(todaySunrise && todaySunset){
      var bucket = computeBucket(now, todaySunrise, todaySunset);
      if(bucket !== currentBucket){
        currentBucket = bucket;
        applyGradient(bucket);
        setClasses(currentBucket, currentState);
      }
      positionSunMoon(now);
    }

    if(dataReady){
      els.updated.textContent = 'Updated ' + relativeTime(lastFetch);
    }
  }

  var lastFetch = null;
  function relativeTime(d){
    if(!d) return '';
    var mins = Math.round((Date.now() - d.getTime())/60000);
    if(mins < 1) return 'just now';
    if(mins === 1) return '1 minute ago';
    return mins + ' minutes ago';
  }

  function reverseGeocode(la, lo){
    return fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+la+'&longitude='+lo+'&localityLanguage=en')
      .then(function(r){ return r.json(); })
      .then(function(j){
        placeName = j.city || j.locality || j.principalSubdivision || '';
        if(j.countryCode && placeName) { /* keep concise, city only */ }
        els.loc.textContent = placeName || '';
      })
      .catch(function(){ els.loc.textContent = ''; });
  }

  function fetchWeather(){
    if(lat==null || lon==null) return;
    var url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
      '&current=temperature_2m,apparent_temperature,weather_code,is_day'+
      '&hourly=temperature_2m,weather_code'+
      '&daily=weather_code,sunrise,sunset,temperature_2m_max,temperature_2m_min'+
      '&temperature_unit=fahrenheit'+
      '&timezone=auto';
    fetch(url).then(function(r){ return r.json(); }).then(function(j){
      var cur = j.current;
      var daily = j.daily;
      var hourly = j.hourly;
      todaySunrise = new Date(daily.sunrise[0]);
      todaySunset = new Date(daily.sunset[0]);

      var state = codeToState(cur.weather_code);
      currentState = state;
      applyWash(state);

      var now = new Date();
      currentBucket = computeBucket(now, todaySunrise, todaySunset);
      applyGradient(currentBucket);
      setClasses(currentBucket, currentState);
      positionSunMoon(now);

      if(state === 'storm') startLightning(); else stopLightning();

      els.temp.textContent = Math.round(cur.temperature_2m);
      els.condition.textContent = LABELS[state];
      els.feels.textContent = 'Feels like ' + Math.round(cur.apparent_temperature) + '° · H ' +
        Math.round(daily.temperature_2m_max[0]) + '° L ' + Math.round(daily.temperature_2m_min[0]) + '°';

      renderHourly(hourly, now);
      renderTomorrow(daily);

      lastFetch = new Date();
      dataReady = true;
      els.updated.textContent = 'Updated just now';

      hideStatus();
    }).catch(function(){
      // keep showing last good data; try again on next cycle
    });
  }

  function renderHourly(hourly, now){
    if(!hourly || !hourly.time) { els.fcHours.innerHTML = ''; return; }
    var todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    var items = [];
    for(var i=0;i<hourly.time.length && items.length<5;i++){
      var dt = new Date(hourly.time[i]);
      if(dt <= now) continue;
      if(dt.getFullYear()!==todayY || dt.getMonth()!==todayM || dt.getDate()!==todayD) break;
      items.push({ time: dt, temp: hourly.temperature_2m[i] });
    }
    var frag = '';
    items.forEach(function(it){
      var label = it.time.toLocaleTimeString([], {hour:'numeric'});
      frag += '<div class="fc-hour">' +
        '<div class="fc-hour-time outlined">'+label+'</div>' +
        '<div class="fc-hour-temp outlined">'+Math.round(it.temp)+'°</div>' +
        '</div>';
    });
    els.fcHours.innerHTML = frag || '<div class="fc-hour-time outlined">No more hours today</div>';
  }

  function renderTomorrow(daily){
    if(!daily || !daily.weather_code || daily.weather_code.length < 2){ els.fcTomorrow.innerHTML=''; return; }
    var state = codeToState(daily.weather_code[1]);
    var hi = Math.round(daily.temperature_2m_max[1]);
    var lo = Math.round(daily.temperature_2m_min[1]);
    els.fcTomorrow.innerHTML =
      '<span class="fc-tomorrow-cond outlined">'+LABELS[state]+'</span>' +
      '<span class="fc-tomorrow-hilo outlined">H '+hi+'° L '+lo+'°</span>';
  }

  function scheduleRefresh(){
    var minutes = 5 + Math.random()*10; // 5–15 minutes
    setTimeout(function(){
      fetchWeather();
      scheduleRefresh();
    }, minutes * 60 * 1000);
  }

  function showStatus(text, showButton){
    els.statusText.textContent = text;
    els.statusBtn.style.display = showButton ? 'inline-block' : 'none';
    els.status.classList.remove('hidden');
  }
  function hideStatus(){ els.status.classList.add('hidden'); }

  function requestLocation(){
    if(!navigator.geolocation){
      showStatus('This browser does not support location access.', false);
      return;
    }
    showStatus('Locating…', false);
    navigator.geolocation.getCurrentPosition(function(pos){
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
      reverseGeocode(lat, lon);
      fetchWeather();
      scheduleRefresh();
    }, function(err){
      showStatus('Location access was denied. Enable it for this page in Settings > Privacy > Location Services, then tap retry.', true);
    }, { enableHighAccuracy:false, timeout:15000, maximumAge:600000 });
  }

  function requestWakeLock(){
    if('wakeLock' in navigator){
      navigator.wakeLock.request('screen').catch(function(){});
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'visible'){
          navigator.wakeLock.request('screen').catch(function(){});
        }
      });
    }
  }

  els.statusBtn.addEventListener('click', requestLocation);

  buildStars();
  buildRain();
  buildSnow();
  applyGradient('day');
  applyWash('clear');
  setClasses('day','clear');
  tickClock();
  setInterval(tickClock, 1000);
  requestWakeLock();
  requestLocation();

})();
</script>
</body>
</html>
